name: Publish example

# Builds the example plugin's release APK for each supported ATAK version and
# publishes them to Arsenal C2 as one release, so there is something to install
# and try without building it.
#
# The example has its own version, in example/version.txt, and its own release
# cadence: bumping that file on main is what publishes it. A library release
# (version.txt at the root, which drives the bridge, the SDK and the CLI) no
# longer ships the example, and the example can ship a fix of its own without
# forcing a library release.
#
# Can also be run by hand, which publishes whatever example/version.txt says on
# the default branch — the way to re-publish a version whose build failed, or to
# push one to a pre-release channel.
#
# Skips, rather than fails, until the ARSENAL_TOKEN secret exists.

on:
  push:
    branches: [main]
    paths: ['example/version.txt']
  workflow_dispatch:
    inputs:
      channel:
        description: Release track to publish to.
        type: choice
        options: [release, rc, beta, alpha]
        default: release
      dry-run:
        description: Check the APK without publishing it.
        type: boolean
        default: false

jobs:
  # Decides whether to publish, and at what version, before anything is built:
  # the APK takes a private SDK download and a Gradle release build to produce,
  # which is wasted work if there is no token or nothing new to push.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve the example version
        id: check
        env:
          ARSENAL_TOKEN: ${{ secrets.ARSENAL_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          VERSION=$(tr -d '[:space:]' < example/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "example/version.txt: $VERSION"

          if [ -z "$ARSENAL_TOKEN" ]; then
            echo "::notice title=publish-example skipped::ARSENAL_TOKEN is not set, so the example was not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A hand-run publish is deliberate and always goes ahead — that is what
          # makes it the re-publish escape hatch. Only a push has to prove the
          # version moved.
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare against the push's base, not HEAD~1: a push that carries the
          # bump plus a follow-up commit would read as unchanged at HEAD~1 and
          # silently skip. The shallow clone above does not contain the base, so
          # fetch just that commit.
          git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true

          # Three outcomes, and collapsing them is what makes this subtle. A base
          # that cannot be resolved at all (a force push, a new branch) publishes:
          # something moved and we cannot see what, and Arsenal C2 rejects a
          # versionCode it already has. A base that resolves but has no
          # example/version.txt is the commit that introduced per-example
          # versioning, which is not a bump — publishing there would re-push a
          # version that already shipped with the library. Only a base whose
          # version differs is a real bump.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Base $BEFORE is unavailable; treating $VERSION as new."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE":example/version.txt 2>/dev/null; then
            echo "::notice title=publish-example skipped::This push introduced example/version.txt ($VERSION) rather than bumping it. Run this workflow by hand to publish $VERSION now."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git show "$BEFORE":example/version.txt | tr -d '[:space:]')
            echo "Previous: $PREV → Current: $VERSION"
            if [ "$VERSION" != "$PREV" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=publish-example skipped::example/version.txt is still $VERSION, so there is nothing new to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # One APK per ATAK version, the same versions the bridge is compiled and
  # published for (test.yml, publish.yml). takdev takes the versionCode from the
  # commit timestamp, so all four builds of one commit share it, and each push
  # below joins the same Arsenal C2 release as another artifact rather than
  # becoming a release of its own. A device is served the build for the newest
  # ATAK version it can run.
  build-example:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    strategy:
      matrix:
        atak-version: ['5.4.0', '5.5.0', '5.5.1', '5.6.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the example APK (ATAK ${{ matrix.atak-version }})
        id: build
        # Two statements, not `echo "apk=$(...)"`: command substitution inside echo
        # discards the script's exit status, so a failed build would report a green
        # step with an empty apk and fail later in the upload step instead.
        # `shell: bash` for the pipefail that makes `| tail` propagate the failure.
        shell: bash
        run: |
          apk="$(./scripts/build-example.sh ${{ matrix.atak-version }} | tail -1)"
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.atak-version }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 7

  # Publishes only once every build has succeeded, so a release never goes out
  # missing an ATAK version because one build broke. The pushes run one after
  # another in a single job: the first creates the release and the rest join it,
  # and joining pushes must repeat the first one's channel and release notes.
  publish-example:
    needs: [check-version, build-example]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: example-*
          path: apks

      - name: Publish to Arsenal C2
        shell: bash
        run: |
          for v in 5.4.0 5.5.0 5.5.1 5.6.0; do
            apk="$(find "apks/example-${v}" -name '*.apk' | head -1)"
            [ -n "${apk}" ] || { echo "::error::no APK was built for ATAK ${v}"; exit 1; }
            ARSENAL_NOTES="atak-reactive example v${{ needs.check-version.outputs.version }}" \
              ./scripts/publish-example.sh "${apk}" ${DRY_RUN}
          done
        env:
          ARSENAL_TOKEN: ${{ secrets.ARSENAL_TOKEN }}
          ARSENAL_ORG: ${{ vars.ARSENAL_ORG || 'user_rixau' }}
          ARSENAL_CHANNEL: ${{ inputs.channel || 'release' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
