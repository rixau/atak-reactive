name: Publish example

# Builds the example plugin's release APK for each supported ATAK version and
# publishes them to Arsenal C2 as one release, so there is something to install
# and try without building it.
#
# The example has its own version, in example/version.txt, and its own release
# cadence: bumping that file on main is what publishes it. A library release
# (version.txt at the root, which drives the bridge, the SDK and the CLI) no
# longer ships the example, and the example can ship a fix of its own without
# forcing a library release.
#
# Every pull request that touches the example, the bridge or the SDK publishes a
# preview build, so the change can be installed and tried from Arsenal C2 before
# it merges. The example builds the bridge and the SDK from source, so the
# preview carries the PR's own code.
#   - A PR that bumps example/version.txt is a release candidate: it publishes
#     that version as-is to the rc channel, and merging publishes the same
#     version to release.
#   - Any other PR publishes to the alpha channel as the example's version plus
#     "-pr<number>"; takdev adds the head commit's short hash, so it reads as
#     "0.3.5-pr78 (0fd87e3a) - [5.6.0]".
# Every push to the PR publishes again: takdev takes the versionCode from the
# head commit's timestamp, so each push is a newer build. Fork and Dependabot PRs
# never publish — they get no secrets, and the build needs the private ATAK SDK.
#
# Can also be run by hand, which publishes whatever example/version.txt says on
# the default branch — the way to re-publish a version whose build failed, or to
# push one to a pre-release channel.
#
# Skips, rather than fails, until the ARSENAL_TOKEN secret exists.

on:
  push:
    branches: [main]
    paths: ['example/version.txt']
  pull_request:
    paths:
      - 'example/**'
      - 'lib/**'
      - 'sdk/**'
      - 'scripts/build-example.sh'
      - 'scripts/publish-example.sh'
      - '.github/workflows/publish-example.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Release track to publish to.
        type: choice
        options: [release, rc, beta, alpha]
        default: release
      dry-run:
        description: Check the APK without publishing it.
        type: boolean
        default: false

# One publish per PR at a time, and never cancelled: a cancelled run can leave a
# release with only some of its ATAK versions. A newer push waits, then publishes
# a newer versionCode over it.
concurrency:
  group: publish-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  # A pull_request run checks out a merge commit GitHub creates for each job, so
  # its timestamp — and with it takdev's versionCode — would differ across the
  # matrix and split one push into four releases. The PR's head commit is what is
  # under review and gives all four builds the same versionCode. Empty (the
  # event's own commit) for push and workflow_dispatch.
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}

jobs:
  # Decides whether to publish, and at what version, before anything is built:
  # the APK takes a private SDK download and a Gradle release build to produce,
  # which is wasted work if there is no token or nothing new to push.
  check-version:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.check.outputs.version }}
      suffix: ${{ steps.check.outputs.suffix }}
      channel: ${{ steps.check.outputs.channel }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 2

      - name: Resolve the example version
        id: check
        env:
          ARSENAL_TOKEN: ${{ secrets.ARSENAL_TOKEN }}
          # The push's base, or the base a PR would merge into; a bump is a
          # version that differs from it.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          VERSION=$(tr -d '[:space:]' < example/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "example/version.txt: $VERSION"

          if [ -z "$ARSENAL_TOKEN" ]; then
            echo "::notice title=publish-example skipped::ARSENAL_TOKEN is not set, so the example was not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A hand-run publish is deliberate and always goes ahead — that is what
          # makes it the re-publish escape hatch.
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The shallow clone above does not contain the base, so fetch just
          # that commit.
          git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true

          # A PR always publishes. One that bumps the version is a release
          # candidate and goes to rc as that version; any other is a preview,
          # and the suffix keeps it from passing for the release it is based on.
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE_VERSION=$(git show "$BEFORE":example/version.txt 2>/dev/null | tr -d '[:space:]')
            if [ -n "$BASE_VERSION" ] && [ "$VERSION" != "$BASE_VERSION" ]; then
              echo "channel=rc" >> "$GITHUB_OUTPUT"
              echo "Publishing release candidate $VERSION (base: $BASE_VERSION)"
            else
              SUFFIX="-pr${{ github.event.pull_request.number }}"
              echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "Publishing preview $VERSION$SUFFIX"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only a push to main has to prove the version moved. Compare against
          # the push's base, not HEAD~1: a push that carries the bump plus a
          # follow-up commit would read as unchanged at HEAD~1 and silently skip.
          #
          # Three outcomes, and collapsing them is what makes this subtle. A base
          # that cannot be resolved at all (a force push, a new branch) publishes:
          # something moved and we cannot see what, and Arsenal C2 rejects a
          # versionCode it already has. A base that resolves but has no
          # example/version.txt is the commit that introduced per-example
          # versioning, which is not a bump — publishing there would re-push a
          # version that already shipped with the library. Only a base whose
          # version differs is a real bump.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Base $BEFORE is unavailable; treating $VERSION as new."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE":example/version.txt 2>/dev/null; then
            echo "::notice title=publish-example skipped::This push introduced example/version.txt ($VERSION) rather than bumping it. Run this workflow by hand to publish $VERSION now."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            PREV=$(git show "$BEFORE":example/version.txt | tr -d '[:space:]')
            echo "Previous: $PREV → Current: $VERSION"
            if [ "$VERSION" != "$PREV" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=publish-example skipped::example/version.txt is still $VERSION, so there is nothing new to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # One APK per ATAK version, the same versions the bridge is compiled and
  # published for (test.yml, publish.yml). takdev takes the versionCode from the
  # commit timestamp, so all four builds of one commit share it, and each push
  # below joins the same Arsenal C2 release as another artifact rather than
  # becoming a release of its own. A device is served the build for the newest
  # ATAK version it can run.
  build-example:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    strategy:
      matrix:
        atak-version: ['5.4.0', '5.5.0', '5.5.1', '5.6.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the example APK (ATAK ${{ matrix.atak-version }})
        id: build
        # Two statements, not `echo "apk=$(...)"`: command substitution inside echo
        # discards the script's exit status, so a failed build would report a green
        # step with an empty apk and fail later in the upload step instead.
        # `shell: bash` for the pipefail that makes `| tail` propagate the failure.
        shell: bash
        run: |
          apk="$(./scripts/build-example.sh ${{ matrix.atak-version }} | tail -1)"
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_TOKEN }}
          EXAMPLE_VERSION_SUFFIX: ${{ needs.check-version.outputs.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.atak-version }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 7

  # Publishes only once every build has succeeded, so a release never goes out
  # missing an ATAK version because one build broke. The pushes run one after
  # another in a single job: the first creates the release and the rest join it,
  # and joining pushes must repeat the first one's channel and release notes.
  publish-example:
    needs: [check-version, build-example]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/download-artifact@v4
        with:
          pattern: example-*
          path: apks

      - name: Publish to Arsenal C2
        shell: bash
        run: |
          for v in 5.4.0 5.5.0 5.5.1 5.6.0; do
            apk="$(find "apks/example-${v}" -name '*.apk' | head -1)"
            [ -n "${apk}" ] || { echo "::error::no APK was built for ATAK ${v}"; exit 1; }
            ARSENAL_NOTES="atak-reactive example v${{ needs.check-version.outputs.version }}${{ needs.check-version.outputs.suffix }}${PREVIEW_NOTE}" \
              ./scripts/publish-example.sh "${apk}" ${DRY_RUN}
          done
        env:
          ARSENAL_TOKEN: ${{ secrets.ARSENAL_TOKEN }}
          ARSENAL_ORG: ${{ vars.ARSENAL_ORG || 'user_rixau' }}
          # A PR goes to rc (version bump) or alpha (preview); only main
          # publishes to release.
          ARSENAL_CHANNEL: ${{ needs.check-version.outputs.channel || inputs.channel || 'release' }}
          # Quoted: unquoted, YAML reads the ` #` below as the start of a comment.
          PREVIEW_NOTE: "${{ github.event_name == 'pull_request' && format(' (preview of #{0}, {1})', github.event.pull_request.number, github.event.pull_request.head.sha) || '' }}"
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
