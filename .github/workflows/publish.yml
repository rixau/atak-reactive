name: Publish

on:
  push:
    branches: [main]
    paths: ['version.txt']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify version sync
        id: check
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          SDK_VERSION=$(node -p "require('./sdk/package.json').version")
          CLI_VERSION=$(node -p "require('./cli/package.json').version")

          echo "version.txt: $VERSION | SDK: $SDK_VERSION | CLI: $CLI_VERSION"

          if [ "$VERSION" != "$SDK_VERSION" ] || [ "$VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Versions must match — version.txt ($VERSION), SDK ($SDK_VERSION), CLI ($CLI_VERSION)"
            exit 1
          fi

          # Check if version actually changed
          PREV=$(git show HEAD~1:version.txt 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "Previous: $PREV → Current: $VERSION"

          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish-npm:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build and publish SDK
        working-directory: sdk
        run: |
          npm install
          npm run test
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and publish CLI
        working-directory: cli
        run: |
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-aar:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      matrix:
        atak-version: ['5.4.0', '5.5.0', '5.5.1', '5.6.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ATAK SDK
        run: ./scripts/download-sdk.sh ${{ matrix.atak-version }}
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_TOKEN }}

      - name: Build and publish to Maven Central
        run: |
          cd lib
          ./gradlew :bridge:publishAndReleaseToMavenCentral \
            -PatakSdkPath=sdks/${{ matrix.atak-version }}/main.jar \
            -PatakVersion=${{ matrix.atak-version }} \
            -PRELEASE_SIGNING_ENABLED=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  release:
    needs: [check-version, publish-npm, publish-aar]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create git tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          git tag "$VERSION" || true
          git push origin "$VERSION" || true
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            || echo "Release already exists"

  # The example plugin, published to Arsenal C2 so there is something to install
  # and try without building it. After `release`, not alongside the registries:
  # nothing depends on the example, so a failure here must never hold back npm or
  # Maven, and the example should only ever ship for a version that did.
  #
  # Skips, rather than fails, until the ARSENAL_TOKEN secret exists.
  publish-example:
    needs: [check-version, release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      ARSENAL_TOKEN: ${{ secrets.ARSENAL_TOKEN }}
    steps:
      - name: Check for the Arsenal C2 token
        id: token
        run: |
          if [ -z "$ARSENAL_TOKEN" ]; then
            echo "::notice title=publish-example skipped::ARSENAL_TOKEN is not set, so the example was not published."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-java@v5
        if: steps.token.outputs.present == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6
        if: steps.token.outputs.present == 'true'

      - name: Build the example APK
        id: build
        if: steps.token.outputs.present == 'true'
        # Two statements, not `echo "apk=$(...)"`: command substitution inside echo
        # discards the script's exit status, so a failed build would report a green
        # step with an empty apk and fail later in the publish step instead.
        # `shell: bash` for the pipefail that makes `| tail` propagate the failure.
        shell: bash
        run: |
          apk="$(./scripts/build-example.sh | tail -1)"
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_TOKEN }}

      - name: Publish to Arsenal C2
        if: steps.token.outputs.present == 'true'
        run: ./scripts/publish-example.sh "${{ steps.build.outputs.apk }}"
        env:
          ARSENAL_ORG: ${{ vars.ARSENAL_ORG || 'user_rixau' }}
          ARSENAL_CHANNEL: release
          ARSENAL_NOTES: atak-reactive v${{ needs.check-version.outputs.version }}
