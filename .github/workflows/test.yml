name: Test

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. With a `branches: [main]`
  # filter a stacked PR — one based on another review branch — reports no checks
  # at all, which reads identically to "checks passed" in the UI.
  pull_request:

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install and test SDK
        working-directory: sdk
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      # `npm test` builds first (the suite runs the real dist/index.cjs), so a
      # separate build step would only build it twice.
      - name: Install, typecheck, and test CLI
        working-directory: cli
        run: |
          npm ci
          npm run typecheck
          npm test

  lib-compile:
    runs-on: ubuntu-latest
    # The ATAK SDK jar is private and must not be visible to code we have not
    # reviewed. Compiling a fork PR would put the jar on disk next to its
    # ./gradlew, so forks skip this job; lib-compile-deferred reports that below.
    # A fork PR that touches lib/ is verified by re-pushing it to a branch in this
    # repo after review, and again on main after merge.
    #
    # GitHub already withholds secrets from fork PRs — without this gate the job
    # ran anyway, failed at the download with a misleading "release not found",
    # and every outside PR sat red for a reason unrelated to its contents.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Every version here is published as an AAR by publish.yml. Compiling against
    # only one of them let a break specific to an older ATAK SDK reach the release
    # job, after npm had already published. Keep this list and the publish matrix
    # in step.
    strategy:
      fail-fast: false
      matrix:
        atak-version: ['5.4.0', '5.5.0', '5.5.1', '5.6.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download ATAK SDK (${{ matrix.atak-version }})
        run: ./scripts/download-sdk.sh ${{ matrix.atak-version }}
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_TOKEN }}
      - name: Compile bridge
        run: |
          cd lib
          ./gradlew :bridge:assembleRelease \
            -PatakSdkPath=sdks/${{ matrix.atak-version }}/main.jar \
            -PatakVersion=${{ matrix.atak-version }}

      # getBridgeVersion() was a hardcoded "0.0.0" for every release up to 0.2.0,
      # so the SDK's mismatch check was noise and a real mismatch was invisible.
      # No JS test can catch a regression here — under vitest SDK_VERSION falls
      # back to "0.0.0" too, which is precisely the value the bug returned. This
      # is the only place the injection is actually observable.
      - name: Bridge reports the version in version.txt
        run: |
          EXPECTED=$(tr -d '[:space:]' < version.txt)
          GENERATED=$(find lib/bridge/build -name BuildConfig.java | head -1)
          echo "checking $GENERATED"
          grep -q "BRIDGE_VERSION = \"${EXPECTED}\"" "$GENERATED" \
            || { echo "::error::bridge reports the wrong version — expected ${EXPECTED}"; \
                 grep -E 'BRIDGE_VERSION|ATAK_VERSION' "$GENERATED"; exit 1; }
          grep -q "ATAK_VERSION = \"${{ matrix.atak-version }}\"" "$GENERATED" \
            || { echo "::error::bridge reports the wrong ATAK version"; \
                 grep -E 'BRIDGE_VERSION|ATAK_VERSION' "$GENERATED"; exit 1; }
          echo "OK: $(grep -E 'BRIDGE_VERSION|ATAK_VERSION' "$GENERATED" | tr -s ' ')"

  # Stand-in for lib-compile on fork PRs, so a skipped compile is visible on the
  # checks page rather than reading as "nothing to check". Warns when lib/ is
  # touched; never fails, since a break there is caught on main after merge.
  lib-compile-deferred:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      pull-requests: read
    steps:
      - name: Report whether lib/ changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if echo "$FILES" | grep -q '^lib/'; then
            echo "::warning title=lib-compile deferred::This fork PR changes lib/ but was not compiled against the ATAK SDK (private jar). Re-push the branch to this repo to verify before merge."
          else
            echo "::notice title=lib-compile skipped::Fork PR does not touch lib/; the bridge compile runs on main after merge."
          fi
