plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

// One source of truth for both the published coordinates and the version the
// bridge reports at runtime. They described the same release but were derived
// separately, and only the coordinates were ever real — getBridgeVersion()
// returned a hardcoded "0.0.0".
def bridgeVersion = file("${rootDir}/../version.txt").text.trim()

// The ATAK version names both the Maven coordinate and what the artifact claims
// it was built against, so it must agree with the jar actually on the compile
// path. It is derived from the sdks/<version>/ path when possible; an explicit
// -PatakVersion that contradicts the path fails the build rather than baking an
// authoritative-looking lie into the AAR.
def atakVersion = project.findProperty('atakVersion')
def sdkPathProp = project.findProperty('atakSdkPath')
def versionFromPath = null
if (sdkPathProp) {
    def m = (sdkPathProp =~ /sdks\/([0-9]+(?:\.[0-9]+)+)\//)
    if (m.find()) versionFromPath = m.group(1)
}
if (atakVersion && versionFromPath && atakVersion != versionFromPath) {
    throw new GradleException(
        "atakVersion=${atakVersion} contradicts atakSdkPath=${sdkPathProp} " +
        "(which is ATAK ${versionFromPath}). The artifact would claim to be " +
        "built against a version it was not. Fix one of the two properties.")
}
atakVersion = atakVersion ?: versionFromPath ?: '5.6.0'

android {
    namespace 'com.atakmap.android.reactive'
    compileSdk 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        consumerProguardFiles "${rootDir}/consumer-rules.pro"

        // Read by AtakBridge.getBridgeVersion() and logged at construction. The
        // ATAK version is carried too: the AAR is published per-ATAK-version, so
        // "0.2.0" alone cannot distinguish a bridge-5.4.0 artifact dropped into a
        // 5.6.0 project — a mismatch the SDK's version check could not see either.
        buildConfigField "String", "BRIDGE_VERSION", "\"${bridgeVersion}\""
        buildConfigField "String", "ATAK_VERSION", "\"${atakVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ["${rootDir}/src/main/java"]
        }
    }
}

dependencies {
    compileOnly files(project.findProperty("atakSdkPath") ? "${rootDir}/${project.findProperty('atakSdkPath')}" : "${rootDir}/sdks/5.6.0/main.jar")
    compileOnly 'androidx.webkit:webkit:1.17.0'
}

mavenPublishing {
    coordinates("dev.atakreactive", "bridge-${atakVersion}", bridgeVersion)
}
